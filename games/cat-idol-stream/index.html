<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>고양이 아이돌 방송</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(160deg,#0e2a52 0%,#1a4a72 55%,#2a7a8e 100%);
    color:#fff; touch-action:manipulation;
  }
  /* ===== 방송 레이아웃 ===== */
  #live { position:fixed; inset:0; display:flex; flex-direction:column; }
  #header {
    flex:0 0 auto; display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; gap:8px; background:rgba(0,0,0,0.25);
    font-size:14px; z-index:3;
  }
  .badge { background:rgba(255,255,255,0.12); border-radius:12px; padding:5px 12px; white-space:nowrap; }
  #liveTag { background:#ff5d7a; font-weight:bold; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.65} }
  #mainArea { flex:1 1 auto; position:relative; overflow:hidden; }
  canvas#stage { position:absolute; inset:0; width:100%; height:100%; }
  /* 팬 채팅 */
  #chat {
    position:absolute; top:10px; right:10px; bottom:10px; width:46%;
    max-width:340px; display:flex; flex-direction:column; justify-content:flex-end;
    pointer-events:none; z-index:2;
  }
  .msg {
    margin-top:6px; padding:7px 11px; border-radius:13px;
    background:rgba(10,8,25,0.55); backdrop-filter:blur(3px);
    font-size:13px; line-height:1.45; color:#f2ecff;
    animation:pop 0.25s ease both;
  }
  .msg b { color:#ffd76e; margin-right:5px; font-size:12px; }
  .msg.f1 b { color:#ff9ec2; } .msg.f2 b { color:#9ed8ff; }
  .msg.f3 b { color:#b5f0a8; } .msg.f4 b { color:#e2b8ff; }
  @keyframes pop { from{transform:translateY(10px); opacity:0} to{transform:none; opacity:1} }
  /* 하단 조작 */
  #footer {
    flex:0 0 auto; display:flex; gap:8px; justify-content:center; align-items:stretch;
    padding:10px 10px calc(12px + env(safe-area-inset-bottom)); z-index:3;
    background:rgba(0,0,0,0.22);
  }
  .act {
    flex:1; max-width:120px; border:none; border-radius:16px;
    padding:12px 4px; font-size:17px; font-weight:bold; color:#3a2a55;
    background:linear-gradient(180deg,#ffe9a8,#ffd76e); cursor:pointer;
    box-shadow:0 3px 0 #c9a43e; line-height:1.3;
  }
  .act:active { transform:translateY(2px); box-shadow:0 1px 0 #c9a43e; }
  .act.sing { background:linear-gradient(180deg,#ffcfe0,#ff9ec2); box-shadow:0 3px 0 #c76d92; color:#6e2a4a; }
  #btnEnd {
    flex:0 0 auto; width:74px; border:none; border-radius:16px;
    background:rgba(255,255,255,0.16); color:#fff; font-size:14px; font-weight:bold;
    box-shadow:0 3px 0 rgba(0,0,0,0.3);
  }
  /* ===== 오버레이 ===== */
  .overlay {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:26px; color:#fff; background:linear-gradient(160deg,#0c2344,#17395e);
  }
  .hidden { display:none !important; }
  h1 { font-size:clamp(25px,6.5vw,40px); margin-bottom:12px; letter-spacing:-1px; }
  .sub { font-size:clamp(14px,3.7vw,17px); color:#d8ccf2; line-height:1.75; margin-bottom:22px; }
  .btn {
    font-size:clamp(17px,4.6vw,21px); font-weight:bold; color:#3a2a55;
    background:linear-gradient(180deg,#ffe9a8,#ffd76e); border:none; border-radius:16px;
    padding:15px 38px; cursor:pointer; box-shadow:0 4px 0 #c9a43e;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #c9a43e; }
  .note { font-size:13px; color:#9d92c2; margin-top:16px; line-height:1.65; }
  #endStats { font-size:clamp(16px,4.2vw,20px); line-height:2.1; margin-bottom:20px; color:#ffe9f3; }
  #endStats b { color:#ffd76e; font-size:1.25em; }
  /* 팬들이 늦게 보내온 AI 편지 (엔딩 화면) */
  #fanLetters { width:min(420px,100%); margin:-10px 0 16px; }
  #fanLetters div {
    margin-top:7px; padding:7px 12px; border-radius:13px; text-align:left;
    background:rgba(10,8,25,0.5); font-size:13px; line-height:1.45; color:#f2ecff;
    animation:pop 0.25s ease both;
  }
  #fanLetters b { margin-right:6px; font-size:12px; }
  #fanLetters div:nth-child(1) b { color:#ff9ec2; }
  #fanLetters div:nth-child(2) b { color:#9ed8ff; }
  #fanLetters div:nth-child(3) b { color:#b5f0a8; }
  #fanLetters div:nth-child(4) b { color:#e2b8ff; }
  .fadeIn { animation:fade 1s ease both; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>

<!-- 방송 화면 -->
<div id="live" class="hidden">
  <div id="header">
    <span class="badge" id="liveTag">● LIVE</span>
    <span class="badge">👥 <span id="viewers">31</span>명</span>
    <span class="badge">💖 관심도 <span id="att">50</span>%</span>
    <span class="badge" id="micBadge">🎙 듣는 중…</span>
    <span class="badge">⏱ <span id="clock">0:00</span></span>
  </div>
  <div id="mainArea">
    <canvas id="stage"></canvas>
    <div id="chat"></div>
  </div>
  <div id="footer">
    <button class="act" id="aGreet">👋<br>인사</button>
    <button class="act sing" id="aSing">🎤<br>노래</button>
    <button class="act" id="aDance">💃<br>춤</button>
    <button class="act" id="aHeart">💗<br>하트</button>
    <button class="act" id="aTalk">💬<br>얘기</button>
    <button id="btnEnd">방송<br>종료</button>
  </div>
</div>

<!-- 시작 화면 -->
<div class="overlay" id="title">
  <h1>🪼 미쿠 물속 방송 🎤</h1>
  <p class="sub">
    네가 오늘의 해파리 미쿠!<br>
    흰 머리, 빨간 눈, 세일러복에 해파리 모자까지 착용 완료!<br>
    버튼으로 인사하고, 춤추고, 하트를 보내면<br>
    팬들이 실시간으로 반응해 줘 💖<br>
    <b>노래 버튼을 누르고 마이크에 대고 진짜로 불러 보자!</b><br>
    목소리가 크고 예쁘면 관심도가 쑥쑥 올라가!
  </p>
  <button class="btn" id="btnStart">마이크 켜고 방송 시작!</button>
  <p class="note" id="micStatus"></p>
  <p class="note">마이크가 안 되어도 걱정 마, 버튼만으로도 방송할 수 있어!</p>
</div>

<!-- 방송 종료 화면 -->
<div class="overlay hidden" id="endScreen">
  <h1>📣 오늘 방송 끝!</h1>
  <div id="endStats"></div>
  <p class="sub" id="endMsg">팬들이 모두 행복하게 잘 자러 갔어. 내일 또 만나!</p>
  <div id="fanLetters"></div>
  <button class="btn" id="btnRetry">다시 방송하기</button>
</div>

<script>
(function(){
'use strict';

// ================= 상태 =================
var state = 'title'; // title | live | end
var att = 50;            // 관심도 0~100
var viewers = 31;
var hearts = 0;          // 받은 하트 누적
var peakViewers = 31;
var startTime = 0;
var singMode = false;    // 노래 중?
var singEnergy = 0;      // 노래 에너지 0~1
var avatar = { x:0, y:0, mouth:0, bounce:0, tilt:0, blush:0 };
var pose = { armL:0.45, armR:0.45, head:0, body:0, bAmp:5, bSpd:1.6 };
var actionAnim = null; // {type, t, dur} 지금 하고 있는 동작
var lastAction = '';
var silenceTimer = 0;
var milestone = 100;
// 말하기 감지용
var voiceTimer = 0;      // 목소리가 계속 들린 시간
var voiceCooldown = 0;   // 방금 대답했으면 잠깐 쉬기
var voiceWasLoud = false;
var voiceWasHigh = false;

// ================= 마이크 =================
var audioCtx = null, analyser = null, timeBuf = null, micOK = false;
var micLevel = 0, pitch = 0;

async function initMic(){
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    var src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    src.connect(analyser);
    timeBuf = new Float32Array(analyser.fftSize);
    micOK = true;
    return true;
  } catch(e){ micOK = false; return false; }
}

function autoCorrelate(buf, sampleRate){
  var SIZE = buf.length, rms = 0, i, j;
  for (i = 0; i < SIZE; i++) rms += buf[i]*buf[i];
  rms = Math.sqrt(rms/SIZE);
  micLevel = Math.min(1, rms * 6);
  if (rms < 0.012) return -1;
  var c = new Array(SIZE);
  for (i = 0; i < SIZE; i++) c[i] = 0;
  for (i = 0; i < SIZE; i++) for (j = 0; j < SIZE-i; j++) c[i] += buf[j]*buf[j+i];
  var d = 0; while (d < SIZE-1 && c[d] > c[d+1]) d++;
  var maxval = -1, maxpos = -1;
  for (i = d; i < SIZE; i++) { if (c[i] > maxval) { maxval = c[i]; maxpos = i; } }
  if (maxpos <= 0) return -1;
  return sampleRate / maxpos;
}

// ================= 팬들 =================
// f1 열성팬, f2 조용한팬, f3 장난꾸러기, f4 새내기팬
var FANS = [
  { id:'f1', name:'미쿠최고팬', weight:1.0 },
  { id:'f2', name: '조용한밤', weight:0.55 },
  { id:'f3', name:'떡볶이킬러', weight:0.9 },
  { id:'f4', name:'오늘첫방', weight:0.85 }
];
var LINES = {
  hello: [
    ['f1','왔다!!! 오늘도 와줬어!!'],
    ['f1','안녕!! 보고 싶었어!'],
    ['f3','ㅋㅋㅋㅋ 인사 너무 귀엽다'],
    ['f4','저 처음 왔어요! 팬 됐어요!'],
    ['f2','왔군. 반가워.']
  ],
  sing_start: [
    ['f1','노래다!!! 노래!!! 🎵'],
    ['f3','조명 조명~'],
    ['f4','노래 좋아요!'],
    ['f2','…기대된다']
  ],
  sing_good: [
    ['f1','우와아아 목소리 최고!! 😭💖'],
    ['f1','이 노래 다시 불러줘!'],
    ['f3','음칠 노래다 진짜 ㅋㅋㅋ'],
    ['f4','인터넷에서 돌아다닐 것 같은 목소리…'],
    ['f2','…잘 부른다. 정말.']
  ],
  sing_low: [
    ['f1','더 크게!! 우리가 다 들켜야지!'],
    ['f3','목소리가 조금 작다 ㅋㅋ 힘내!']
  ],
  dance: [
    ['f1','춤춘다!! 춤!! 💃'],
    ['f3','팔 흔드는 거 봐라 ㅋㅋㅋㅋ'],
    ['f4','와 구분 좀 보여줘요!']
  ],
  heart: [
    ['f1','하트 받았다!! 💖💖💖'],
    ['f2','…하트 챙겨 간다'],
    ['f4','저두요 저두요! 💗']
  ],
  talk: [
    ['f1','얘기해줘서 좋아!!'],
    ['f3','오늘 뭐 했어요? 궁금해요'],
    ['f4','목소리 들으니까 힘이 나요'],
    ['f2','잘 들었다']
  ],
  voice: [
    ['f1','어? 말소리 들린다! 무슨 얘기야??'],
    ['f1','목소리 들려!! 더 얘기해줘!'],
    ['f3','ㅋㅋㅋㅋ 뭐라고 했어 또 해봐'],
    ['f3','오목소리 나왔다 ㅋㅋ 대답해줘!'],
    ['f4','저도 듣고 있어요!'],
    ['f2','…응, 듣고 있어']
  ],
  voice_loud: [
    ['f1','우와 목소리 커졌다!! 🔊'],
    ['f3','ㅋㅋㅋㅋ 왜 이렇게 크게 웃겨 ㅋㅋㅋ'],
    ['f4','깜짝 놀랐어요!'],
    ['f2','…좀 크다']
  ],
  voice_high: [
    ['f1','고음이다!! 😲 소름 돋아!'],
    ['f3','우와 뭐야 그 목소리 ㅋㅋㅋ 다시!'],
    ['f4','돌고래 목소리ㅠㅠ 너무 예뻐요!']
  ],
  silent: [
    ['f1','어? 왜 이렇게 조용해?'],
    ['f3','쉬는 시간인가 ㅋㅋ'],
    ['f4','괜찮아요?']
  ],
  viewers_up: [
    ['f1','사람 늘었다!! 역시 인기 아이돌!'],
    ['f3','우리 일찍 온 거 대박이다'],
    ['f4','여기 좋은 방송이에요!'
    ]
  ],
  goodbye: [
    ['f1','잘 자!! 내일 꼭 와줘! 💖'],
    ['f3','ㅋㅋㅋ 오늘 재밌었다!'],
    ['f4','첫방인데 너무 좋았어요!'],
    ['f2','…내일 또 보자']
  ]
};
var chatEl = document.getElementById('chat');
function pushChat(who, text){
  var d = document.createElement('div');
  d.className = 'msg ' + who;
  var fan = FANS.find(function(f){ return f.id === who; });
  d.innerHTML = '<b>' + (fan ? fan.name : '?') + '</b>' + text;
  chatEl.appendChild(d);
  while (chatEl.children.length > 7) chatEl.removeChild(chatEl.firstChild);
}
function fanReact(key, chance){
  if (Math.random() > (chance === undefined ? 0.8 : chance)) return;
  var pool = LINES[key];
  var pick = pool[Math.floor(Math.random()*pool.length)];
  pushChat(pick[0], pick[1]);
}
function ambientChat(){
  // 관심도가 높으면 팬들이 더 자주 수다 떨기
  var rate = 0.3 + att/100 * 1.4;
  if (Math.random() < 0.006 * rate * 60 * DT) {
    var keys = ['hello','talk','dance','heart'];
    var extra = [['f1','지금 관심도 ' + Math.round(att) + '%다!'],['f3','시청자 늘어난다 ㅋㅋ'],['f4','여기 분위기 최고예요']];
    if (Math.random() < 0.5) { var p = extra[Math.floor(Math.random()*extra.length)]; pushChat(p[0], p[1]); }
    else fanReact(keys[Math.floor(Math.random()*keys.length)], 1);
  }
}

// ================= AI (가족 GLM 릴레이) =================
// 우리 집 릴레이(키 없음, tailnet에서만 동작). 실패하면 null → 원래 대사로 진행.
var AI = {
  url: 'https://vps.mogera-goblin.ts.net:10001/v1/chat/completions',
  model: 'glm-5.3-flash',
  chat: function(messages, opts){
    opts = opts || {};
    return fetch(this.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: this.model,
        thinking: { type: 'disabled' },
        messages: messages,
        max_tokens: opts.maxTokens || 350,
        temperature: opts.temperature || 0.9
      }),
      signal: AbortSignal.timeout(opts.timeoutMs || 4500)
    }).then(function(res){
      if (!res.ok) return null;
      return res.json().then(function(data){
        var t = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        return t ? t.trim() : null;
      });
    }).catch(function(){ return null; });
  }
};

// ================= 행동 =================
// 동작 시작: type별로 캐릭터가 자연스럽게 따라 함
function startAnim(type, dur){ actionAnim = { type: type, t: 0, dur: dur }; }

function actGreet(){
  startAnim('greet', 2.2); addAtt(6); hearts += 2;
  fanReact('hello'); lastAction='인사'; silenceTimer=0;
}
function actDance(){
  startAnim('dance', 3.8); addAtt(9); hearts += 3;
  fanReact('dance'); lastAction='춤'; silenceTimer=0;
}
function actHeart(){
  startAnim('heart', 2.0); avatar.blush = 1.4; addAtt(5); hearts += 6;
  fanReact('heart'); lastAction='하트'; silenceTimer=0;
}
function actTalk(){
  startAnim('talk', 2.4); addAtt(4); hearts += 2;
  fanReact('talk'); lastAction='얘기'; silenceTimer=0;
}
function actSing(){
  singMode = !singMode;
  if (singMode) {
    fanReact('sing_start'); lastAction='노래 시작';
  } else {
    singMode = false; singEnergy = 0;
  }
  silenceTimer = 0;
}
function addAtt(v){
  att = Math.max(0, Math.min(100, att + v));
}

// ================= 루프 =================
var lastT = 0, DT = 1/60;
function frame(t){
  var dt = Math.min((t-lastT)/1000, 0.05); DT = dt; lastT = t;
  if (state === 'live') update(dt, t/1000);
  draw(t/1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function update(dt, time){
  // 마이크 측정
  micLevel = 0; pitch = -1;
  if (micOK && analyser) {
    analyser.getFloatTimeDomainData(timeBuf);
    var f = autoCorrelate(timeBuf, audioCtx.sampleRate);
    if (f > 80 && f < 1300) pitch = f;
  }
  // 노래 중이면 목소리로 에너지 충전
  if (singMode) {
    singEnergy = Math.max(0, micLevel - 0.08) * 1.6;
    avatar.mouth = Math.min(1, micLevel * 2.2);
    if (micLevel > 0.14) {
      addAtt(dt * (6 + singEnergy * 14));
      hearts += dt * 3 * (0.5 + singEnergy);
      if (Math.random() < dt * 0.5) fanReact(micLevel > 0.3 ? 'sing_good' : 'sing_low', 0.9);
      silenceTimer = 0;
    }
  } else {
    avatar.mouth = Math.max(0, avatar.mouth - dt*3);
  }

  // ===== 말하기 감지: 노래 중이 아닐 때 마이크로 말하면 팬이 반응 =====
  voiceCooldown = Math.max(0, voiceCooldown - dt);
  if (!singMode && micLevel > 0.13) {
    voiceTimer += dt;
    avatar.mouth = Math.min(1, micLevel * 2.2);
    if (micLevel > 0.5) voiceWasLoud = true;
    if (pitch > 500) voiceWasHigh = true;
    silenceTimer = 0;
    addAtt(dt * 3); // 말하기만 해도 관심도 조금 오름
    // 말하는 도중에도 가끔 리액션
    if (voiceTimer > 1.4 && Math.random() < dt * 1.2 && voiceCooldown === 0) {
      fanReact('voice', 0.9);
      voiceCooldown = 2.5;
    }
  } else if (voiceTimer > 0.35) {
    // 말이 끝났을 때: 목소리 특징에 맞는 대답
    if (voiceCooldown === 0) {
      if (voiceWasHigh) fanReact('voice_high', 0.95);
      else if (voiceWasLoud) fanReact('voice_loud', 0.95);
      else fanReact('voice', 0.9);
      voiceCooldown = 1.8;
    }
    voiceTimer = 0;
    voiceWasLoud = false;
    voiceWasHigh = false;
  } else if (!singMode) {
    voiceTimer = 0;
  }

  // 침묵 판정 (노래 아닐 때)
  if (!singMode && micLevel < 0.05) {
    silenceTimer += dt;
    if (silenceTimer > 6) { att -= dt * 3; if (Math.random() < dt*0.3) fanReact('silent', 0.5); }
  } else if (!singMode) silenceTimer = 0;

  // 관심도 유지/감소
  if (att > 60) att -= dt * 0.6;
  att = Math.max(0, att);

  // 시청자 수
  var target = 25 + att * att / 45 + (time - startTime > 60 ? 150 : 0);
  viewers += (target - viewers) * dt * 0.25 + (Math.random()-0.5) * 3;
  viewers = Math.max(5, viewers);
  peakViewers = Math.max(peakViewers, Math.floor(viewers));
  if (viewers > milestone) {
    fanReact('viewers_up');
    milestone = milestone < 500 ? 500 : milestone < 1000 ? 1000 : milestone + 1000;
  }

  ambientChat();

  // ===== 캐릭터 포즈: 행동에 맞춰 자연스럽게 따라 움직임 =====
  var tg = { armL:0.45, armR:0.45, head:0, body:0, bAmp:5, bSpd:1.6 };
  if (actionAnim) {
    actionAnim.t += dt;
    var a = actionAnim, k = a.t;
    if (a.type === 'greet') {
      tg.armR = -2.0 + Math.sin(k*9)*0.35;   // 오른팔 들고 흔들기
      tg.head = Math.sin(k*4.5)*0.1;          // 고개 갸웃
    } else if (a.type === 'dance') {
      tg.armL = -0.5 + Math.sin(k*7)*0.95;    // 팔 번갈아 흔들기
      tg.armR = -0.5 - Math.sin(k*7)*0.95;
      tg.body = Math.sin(k*3.5)*0.13;         // 몸통 흔들기
      tg.head = Math.sin(k*3.5)*0.12;
      tg.bAmp = 11; tg.bSpd = 5;
    } else if (a.type === 'heart') {
      tg.armL = -2.55; tg.armR = -2.55;       // 두 팔 위로 모아 하트 만들기
      tg.head = 0.1;
      tg.bAmp = 3; tg.bSpd = 1;
    } else if (a.type === 'talk') {
      tg.armR = 0.15 + Math.sin(k*4)*0.2;     // 말하듯 손짓
      tg.head = Math.sin(k*2)*0.07;
      avatar.mouth = 0.35 + Math.sin(k*14)*0.35; // 입 심술껍쩍?
    }
    if (a.t >= a.dur) actionAnim = null;
  }
  if (singMode) { // 노래 중: 마이크 잡고 몸 살랑
    tg.armL = 0.8;
    tg.armR = 0.1 + Math.sin(time*3)*0.2;
    tg.body = Math.sin(time*1.5)*0.06;
    tg.bAmp = 6 + singEnergy*9; tg.bSpd = 3 + singEnergy*4;
  }
  // 부드럽게 따라오기 (스무딩)
  var sm = Math.min(1, dt*7);
  pose.armL += (tg.armL - pose.armL) * sm;
  pose.armR += (tg.armR - pose.armR) * sm;
  pose.head += (tg.head - pose.head) * sm;
  pose.body += (tg.body - pose.body) * sm;
  pose.bAmp += (tg.bAmp - pose.bAmp) * sm;
  pose.bSpd += (tg.bSpd - pose.bSpd) * sm;
  avatar.blush = Math.max(0, avatar.blush - dt*0.6);

  // UI 갱신
  document.getElementById('viewers').textContent = Math.floor(viewers).toLocaleString();
  document.getElementById('att').textContent = Math.round(att);
  var mb = document.getElementById('micBadge');
  if (singMode) mb.textContent = '🎤 노래 중!';
  else if (micLevel > 0.13) mb.textContent = '🎙 듣고 있어!';
  else mb.textContent = '🎙 듣는 중…';
  var sec = Math.floor(time - startTime);
  document.getElementById('clock').textContent = Math.floor(sec/60) + ':' + ('0'+(sec%60)).slice(-2);
}

var canvas = document.getElementById('stage');
var ctx = canvas.getContext('2d');
var DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize(){
  var r = canvas.parentElement.getBoundingClientRect();
  canvas.width = r.width * DPR; canvas.height = r.height * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

var notes = [];
var bubbles = [];
function draw(time){
  if (state !== 'live') return;
  var r = canvas.getBoundingClientRect();
  var W = r.width, H = r.height;
  ctx.clearRect(0,0,W,H);

  // 물속 빛
  var g = ctx.createRadialGradient(W*0.7, -H*0.1, 20, W*0.5, H*0.6, H*1.1);
  g.addColorStop(0,'rgba(180,235,255,0.28)');
  g.addColorStop(1,'rgba(20,60,120,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // 위에서 내려오는 빛살
  ctx.globalAlpha = 0.10 + Math.sin(time*0.8)*0.04;
  ctx.fillStyle = '#cfeeff';
  for (var r = 0; r < 3; r++) {
    ctx.beginPath();
    var rx = W*0.55 + r*W*0.13;
    ctx.moveTo(rx, -10); ctx.lineTo(rx + W*0.06, -10);
    ctx.lineTo(rx - W*0.18 + r*30, H); ctx.lineTo(rx - W*0.3 + r*30, H);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 발밑 빛
  ctx.fillStyle = 'rgba(160,230,255,0.08)';
  ctx.beginPath(); ctx.ellipse(W*0.32, H*0.9, W*0.3, H*0.045, 0, 0, 7); ctx.fill();

  // 올라가는 물방울
  if (Math.random() < 0.1) bubbles.push({ x: Math.random()*W, y: H+10, r: 2+Math.random()*6, v: 25+Math.random()*35, ph: Math.random()*6.28 });
  ctx.strokeStyle = 'rgba(220,245,255,0.5)'; ctx.lineWidth = 1.5;
  for (var b = bubbles.length-1; b >= 0; b--) {
    var bb = bubbles[b];
    bb.y -= bb.v * DT;
    var bx = bb.x + Math.sin(bb.y*0.02 + bb.ph)*10;
    if (bb.y < -12) { bubbles.splice(b,1); continue; }
    ctx.beginPath(); ctx.arc(bx, bb.y, bb.r, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(bx - bb.r*0.3, bb.y - bb.r*0.3, bb.r*0.25, 0, 7); ctx.stroke();
  }

  // 떠다니는 하트/음표
  if (Math.random() < 0.06 + singEnergy*0.3) {
    notes.push({ x: W*0.32 + (Math.random()-0.5)*W*0.35, y: H*0.55, vy: -40-Math.random()*50, life: 1, ch: Math.random()<0.5?'♪':'💗' });
  }
  ctx.textAlign='center'; ctx.font='18px sans-serif';
  for (var i = notes.length-1; i >= 0; i--) {
    var n = notes[i];
    n.y += n.vy * DT; n.life -= DT*0.5;
    if (n.life <= 0) { notes.splice(i,1); continue; }
    ctx.globalAlpha = n.life;
    ctx.fillText(n.ch, n.x + Math.sin(n.y*0.05)*8, n.y);
  }
  ctx.globalAlpha = 1;

  drawIdol(W*0.34, H*0.6, time, W);
  if (singMode) drawSingMeter(W, H);
}

// 그림 느낌 미쿠 그리기 (포즈 따라 움직임)
function drawIdol(cx, cy, time, W){
  var S = Math.min(W*0.42, 340);        // 전체 크기
  var k = S / 340;                       // 스케일 계수
  var bob = Math.sin(time*pose.bSpd)*pose.bAmp*k;
  var drift = Math.sin(time*0.9)*7*k;
  ctx.save();
  ctx.translate(cx + drift, cy - bob);
  ctx.rotate(pose.body + pose.head*0.35);
  ctx.scale(k, k);
  // 부위 기준점 (340 기준)
  var HIP = 60, TORSO = -18, NECK = -76, HEAD = -118;

  // 뒷머리 (몸 뒤)
  drawPart(SVGPARTS.hairBack, 0, -60, 0, 0.78);

  // 다리 생략(스커트 아래 은은한 그림자)
  ctx.fillStyle = 'rgba(20,40,90,0.25)';
  ctx.beginPath(); ctx.ellipse(0, HIP+26, 46, 12, 0, 0, 7); ctx.fill();

  // 스커트
  drawPart(SVGPARTS.skirt, 0, HIP-38, 0, 1);

  // 팔 (몸 뒤로 살짝 뒤로 빠지게) — 포즈 각도 적용
  drawArm(-1, pose.armL, time);
  drawArm(1, pose.armR, time);

  // 상의
  drawPart(SVGPARTS.torso, 0, TORSO, 0, 1);

  // 머리 (갸웃)
  ctx.save();
  ctx.translate(0, NECK);
  ctx.rotate(pose.head);
  drawPart(SVGPARTS.head, 0, HEAD-NECK, 0, 1);
  // 입 (목소리 볼륨으로) — 얼굴 위에 캔버스로
  var mo = 2.5 + avatar.mouth * 10;
  ctx.fillStyle = '#c2183c';
  ctx.beginPath(); ctx.ellipse(-1, 24, 5, mo, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#8f1030';
  ctx.beginPath(); ctx.ellipse(-1, 24+mo*0.4, 3.4, mo*0.4, 0, 0, 7); ctx.fill();
  // 해파리 모자
  var jellyBob = Math.sin(time*2)*3;
  drawPart(SVGPARTS.jelly, 4, -66 + jellyBob*0.4, Math.sin(time*1.3)*0.06, 0.72);
  ctx.restore();

  // 마이크 (오른손 위치 근처)
  ctx.save();
  ctx.strokeStyle = '#efeaff'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(30, 18); ctx.lineTo(52, 2); ctx.stroke();
  ctx.fillStyle = '#ffd76e'; ctx.beginPath(); ctx.arc(56, -2, 11, 0, 7); ctx.fill();
  ctx.strokeStyle = '#c9a43e'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(56, -2, 11, 0, 7); ctx.stroke();
  ctx.restore();

  // 하트 보내기: 머리 위 커다란 하트
  if (actionAnim && actionAnim.type === 'heart') {
    var pop = Math.min(1, actionAnim.t / 0.35);
    ctx.font = Math.round((26 + pop*24) * 1.4) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💖', 0, -190 - pop*14);
  }
  ctx.restore();
}

function drawPart(img, x, y, rot, scale){
  if (!img || !img.complete || img.width === 0) return; // 아직 로딩 중이면 건너뛰기
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  var w = img.width * scale, h = img.height * scale;
  ctx.drawImage(img, -w/2, -h/2, w, h);
  ctx.restore();
}

function drawArm(side, ang, time){
  // 어깨 위치
  var sx = side * 46, sy = -42;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(side * ang);
  drawPart(SVGPARTS.arm, 0, 34, 0, 0.95);
  ctx.restore();
}

function drawSingMeter(W, H){
  var w = Math.min(W*0.55, 260), x = W*0.5 - w/2, y = H - 20;
  ctx.fillStyle='rgba(0,0,0,0.35)';
  rr(x, y, w, 12, 6); ctx.fill();
  ctx.fillStyle = singEnergy > 0.15 ? '#ff9ec2' : '#8ea';
  rr(x, y, Math.max(4, w*singEnergy), 12, 6); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  ctx.fillText('🎤 노래 중! 크게 불러봐!', W*0.5, y - 6);
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// ================= 시작/종료 =================
async function startGame(){
  var st = document.getElementById('micStatus');
  st.textContent = '마이크 켜는 중…';
  var ok = await initMic();
  st.textContent = ok ? '✓ 마이크 준비 완료!' : '마이크 없이도 버튼으로 방송할 수 있어!';
  document.getElementById('title').classList.add('hidden');
  document.getElementById('live').classList.remove('hidden');
  resize();
  att = 50; viewers = 31; hearts = 0; peakViewers = 31;
  singMode = false; singEnergy = 0; silenceTimer = 0; milestone = 100;
  voiceTimer = 0; voiceCooldown = 0; voiceWasLoud = false; voiceWasHigh = false;
  startTime = lastT/1000;
  state = 'live';
  setTimeout(function(){ fanReact('hello', 1); }, 600);
  setTimeout(function(){ pushChat('f1','오늘도 방송 기다렸어! 💖'); }, 1800);
}
function endGame(){
  if (state === 'end') return; // 종료 버튼/esc 연타로 엔딩이 두 번 뜨지 않게
  state = 'end';
  singMode = false;
  var grade = att > 85 ? '🏆 전설의 아이돌!' : att > 60 ? '⭐ 슈퍼 아이돌!' : '🌱 내일 더 잘할 수 있어!';
  var durMin = Math.max(1, Math.round((lastT/1000 - startTime) / 60));
  var endMsgEl = document.getElementById('endMsg');
  var defaultEnd = '팬들이 모두 행복하게 잘 자러 갔어. 내일 또 만나!';
  endMsgEl.textContent = defaultEnd;
  document.getElementById('fanLetters').innerHTML = '';

  // 엔딩 팬 리액션: AI가 이번 방송 기록을 보고 작별 인사를 쓴다(엔딩당 1회 호출).
  // 릴레이는 Tailscale이 켜져 있어야 하고, 안 오면 원래 고정 문장으로 그대로 끝난다.
  var aiEnding = AI.chat([
    { role: 'system', content: '게임 "미쿠 물속 방송"(해파리 아이돌 미쿠) 엔딩 작가. 팬 4명 성격 — 미쿠최고팬(열성, 이모지), 조용한밤(과묵, "…"), 떡볶이킬러(장난, ㅋㅋㅋ), 오늘첫방(새내기, 존댓말). 아이가 읽는 한국어로 따뜻하게. 설명 없이 JSON만 출력: {"goodbye":["30자 이하 문장 4개(미쿠최고팬, 조용한밤, 떡볶이킬러, 오늘첫방 순서)"],"end":"50자 이하 마무리 문장(방송 기록 한 가지 언급)"}' },
    { role: 'user', content: '방송 기록: ' + durMin + '분 동안 최고 시청자 ' + peakViewers + '명, 하트 ' + Math.floor(hearts) + '개, 최종 관심도 ' + Math.round(att) + '%, 마지막 행동 ' + (lastAction || '인사') + '. 엔딩 JSON만 줘.' }
  ], { maxTokens: 260, timeoutMs: 12000 }).then(function(text){
    var m = text && text.match(/\{[\s\S]*\}/);
    if (!m) return null;
    try {
      var j = JSON.parse(m[0]);
      var g = Array.isArray(j.goodbye) ? j.goodbye.map(function(s){ return String(s || '').slice(0, 60); }) : [];
      if (g.filter(function(s){ return s; }).length < 2) return null;
      return { goodbye: g, end: j.end ? String(j.end).slice(0, 90) : null };
    } catch (e) { return null; }
  });

  // 팬들은 먼저 원래 하듯 인사하고 흩어진다(여기까지는 언제나 같음)
  LINES.goodbye.forEach(function(l, i){
    setTimeout(function(){ pushChat(l[0], l[1]); }, i*500);
  });
  setTimeout(function(){
    document.getElementById('live').classList.add('hidden');
    var stats = document.getElementById('endStats');
    stats.innerHTML =
      '최고 시청자: <b>' + peakViewers.toLocaleString() + '명</b><br>' +
      '받은 하트: <b>' + Math.floor(hearts).toLocaleString() + '개</b> 💖<br>' +
      '최종 관심도: <b>' + Math.round(att) + '%</b><br>' + grade;
    var ov = document.getElementById('endScreen');
    ov.classList.remove('hidden'); ov.classList.add('fadeIn');
  }, 2400);

  // 조금 뒤, AI가 이번 방송 기록을 보고 팬들의 "늦은 편지"를 엔딩 화면에 보내준다.
  // Tailscale이 꺼져 있거나 AI가 늦/실패하면 편지는 그냥 안 온다(엔딩은 그대로 완결).
  aiEnding.then(function(ai){
    if (!ai || state !== 'end') return; // 그 사이 다시 방송을 시작했으면 무시
    if (ai.end) endMsgEl.textContent = ai.end;
    var fanNames = ['미쿠최고팬', '조용한밤', '떡볶이킬러', '오늘첫방'];
    ai.goodbye.forEach(function(line, i){
      if (!line) return;
      setTimeout(function(){
        if (state !== 'end') return;
        var row = document.createElement('div');
        var b = document.createElement('b');
        b.textContent = fanNames[i] || '팬';
        row.appendChild(b);
        row.appendChild(document.createTextNode(' ' + line));
        var lettersEl = document.getElementById('fanLetters');
        lettersEl.appendChild(row);
        while (lettersEl.children.length > 4) lettersEl.removeChild(lettersEl.firstChild);
      }, 400 + i * 600);
    });
  });
}
document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnRetry').addEventListener('click', function(){
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('live').classList.remove('hidden');
  chatEl.innerHTML = '';
  att = 50; viewers = 31; hearts = 0; peakViewers = 31;
  singMode = false; singEnergy = 0; silenceTimer = 0; milestone = 100;
  voiceTimer = 0; voiceCooldown = 0; voiceWasLoud = false; voiceWasHigh = false;
  startTime = lastT/1000;
  state = 'live';
  fanReact('hello', 1);
});
document.getElementById('btnEnd').addEventListener('click', endGame);
document.getElementById('aGreet').addEventListener('click', function(){ if(state==='live') actGreet(); });
document.getElementById('aSing').addEventListener('click', function(){ if(state==='live') actSing(); });
document.getElementById('aDance').addEventListener('click', function(){ if(state==='live') actDance(); });
document.getElementById('aHeart').addEventListener('click', function(){ if(state==='live') actHeart(); });
document.getElementById('aTalk').addEventListener('click', function(){ if(state==='live') actTalk(); });
// 키보드: 1~5 행동, Esc 종료
document.addEventListener('keydown', function(e){
  if (state !== 'live') return;
  if (e.key==='1') actGreet();
  if (e.key==='2') actSing();
  if (e.key==='3') actDance();
  if (e.key==='4') actHeart();
  if (e.key==='5') actTalk();
  if (e.key==='Escape') endGame();
});

})();
